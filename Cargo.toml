[package]
name = "ctx-agent"
version = "0.7.4"
edition = "2021"
description = "Context bill and evidence-gated tool-result trimming for coding agents (Claude Code, Cursor, Codex): see what context costs, trim what randomized checks clear, undo byte for byte"
license = "MIT"
repository = "https://github.com/saurabh0392/ctx"
readme = "README.md"
keywords = ["claude-code", "mcp", "context", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Allowlist, not a denylist. `exclude` only removes what it names, so anything untracked sitting in
# the working tree (a node_modules from a sibling service, a demo video) lands in the published
# crate and blows past the 10 MiB limit. This names exactly what the crate needs to build and run.
include = [
    "/src/**/*",
    "/assets/**/*",
    "/plugins/**/*",
    "/scripts/ctx-statusline.sh",
    "/scripts/ctx-statusline.ps1",
    "/docs/experiment-plan.ctx.toml",
    "/docs/experiment-plan.gaffer.toml",
    "/docs/experiment-plan.tool-mix.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
name = "ctx"
path = "src/lib.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Untrusted MCP schemas must never resolve network or file references during trimming.
jsonschema = { version = "0.48.1", default-features = false }
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
open = "5"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

[features]
default = []
onnx = ["ort", "tokenizers"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
