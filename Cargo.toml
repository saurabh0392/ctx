[package]
name = "ctx"
version = "0.6.1"
edition = "2021"
description = "Local context truth, recovery, and tool-result control for coding agents"

[lib]
name = "ctx"
path = "src/lib.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Untrusted MCP schemas must never resolve network or file references during trimming.
jsonschema = { version = "0.48.1", default-features = false }
toml = "0.8"
dirs = "5"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
open = "5"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

[features]
default = []
onnx = ["ort", "tokenizers"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
