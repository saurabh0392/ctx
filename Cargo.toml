[package]
name = "ctx"
version = "0.1.1"
edition = "2021"
description = "Context Killer - MCP filter proxy for Claude Code"

[lib]
name = "ctx"
path = "src/lib.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
bytes = "1"
open = "5"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http = "1"
tower-service = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

[features]
default = []
onnx = ["ort", "tokenizers"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
