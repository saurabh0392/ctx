</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-mark">ctx<span>.</span></div>
    <div class="sb-logo-sub">AI Efficiency</div>
  </div>

  <div class="nav-section">Your context</div>
  <div class="nav-item active" onclick="showTab('context',this)">
    <span class="nav-icon">◎</span> Home
  </div>
  <div class="nav-item" onclick="showTab('proof',this)">
    <span class="nav-icon">◆</span> Proof
  </div>
  <div class="nav-item" onclick="showTab('trace',this)">
    <span class="nav-icon">≡</span> Activity
  </div>

  <div class="nav-section">Setup</div>
  <div class="nav-item" onclick="showTab('profiles',this)">
    <span class="nav-icon">🎛</span> Profiles
  </div>
  <div class="nav-item" onclick="showTab('settings',this)">
    <span class="nav-icon">⚙️</span> Settings
  </div>
  <div class="nav-section" id="nav-dev-section" style="display:none">Dev</div>
  <div class="nav-item" id="nav-dev-experiment" style="display:none" onclick="showTab('experiment',this)">
    <span class="nav-icon">🧪</span> Proving
  </div>

  <!-- Efficiency score (populated by JS) -->
  <div class="sb-score-card" id="sb-score-card" style="display:none">
    <div class="sb-score-label">Efficiency score</div>
    <div class="sb-score-row">
      <div class="sb-gauge">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="none" stroke="#1a2438" stroke-width="5"/>
          <circle id="sb-gauge-ring" cx="24" cy="24" r="20" fill="none" stroke="#22c55e" stroke-width="5"
            stroke-dasharray="125.66" stroke-dashoffset="125.66" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--t1)" id="sb-gauge-val">n/a</div>
      </div>
      <div>
        <div class="sb-score-val" id="sb-score-val" style="color:var(--t3)">n/a</div>
        <div class="sb-score-text" id="sb-score-text">Loading</div>
      </div>
    </div>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn">
    <span class="theme-toggle-icon" id="theme-icon">☀️</span>
    <span id="theme-label">Light mode</span>
  </button>

  <div class="sb-proxy">
    <span class="status-dot off" id="status-dot"></span>
    <span id="status-text">Checking...</span>
    <div id="socket-status" style="font-size:10px;color:var(--t4);margin-top:4px">Event stream: none yet</div>
  </div>
</aside>

<!-- ═══ Dashboard main ═══ -->
<div class="main-wrap">
<div class="ctx-range-bar" id="ctx-range-bar">
  <span style="font-weight:700;color:var(--t2);text-transform:uppercase;font-size:10px;letter-spacing:.06em">Data</span>
  <label><input type="radio" name="ctx-data-range" id="ctx-range-wm" value="wm"> Since ctx tracked</label>
  <label><input type="radio" name="ctx-data-range" id="ctx-range-all" value="all"> All time</label>
  <span id="ctx-range-meta" style="color:var(--t4);max-width:640px;line-height:1.45"></span>
</div>
