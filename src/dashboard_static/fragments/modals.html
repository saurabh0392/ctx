<!-- New profile modal -->
<div class="modal-backdrop" id="new-profile-modal">
  <div class="modal">
    <div class="modal-title">Create profile</div>
    <label>Name</label>
    <input type="text" id="new-profile-name" placeholder="e.g. writing">
    <label>MCP servers to include</label>
    <div class="server-checklist" id="server-checklist"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeNewProfileModal()">Cancel</button>
      <button class="modal-btn primary" onclick="createProfile()">Create</button>
    </div>
  </div>
</div>
