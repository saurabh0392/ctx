name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (arm64) — also cross-compiles x86_64
            target: aarch64-apple-darwin
          - os: macos-latest       # cross-compile Intel x86_64 from Apple Silicon runner
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test

      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ctx"
          ARCHIVE="ctx-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname $BIN)" "$(basename $BIN)"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctx-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Behavioral coherence gate: the dashboard must pass every invariant against a seeded fixture before
  # a release can publish. This is the deterministic gate (exact pass/fail).
  coherence:
    name: Behavioral coherence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build binary + fixture seeder
        run: |
          cargo build --release
          cargo build --release --example seed_coherence_fixture
      - name: Install coherence deps + chromium
        working-directory: scripts/coherence
        run: |
          npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Seed the CI fixture
        run: |
          mkdir -p "$RUNNER_TEMP/ctx-fixture"
          CTX_HOME="$RUNNER_TEMP/ctx-fixture" ./target/release/examples/seed_coherence_fixture
      - name: Run coherence suite
        env:
          CTX_FIXTURE: ${{ runner.temp }}/ctx-fixture
          PW_CHANNEL: ""
        run: bash scripts/coherence/coherence.sh

  # Fitcheck gate: a headless persona review of the dashboard. Model judgement, so it blocks the clear
  # failure (Rework) by default; set FITCHECK_MIN_VERDICT=Ship to require a Ship. Needs the API key
  # secret, and fails loudly if absent so a release never publishes with the gate silently skipped.
  fitcheck:
    name: Fitcheck (design gate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Fitcheck gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "release fitcheck gate needs the ANTHROPIC_API_KEY secret."
            echo "Set it in repo settings, or bypass one release with SKIP_FITCHECK=1 in this job env."
            exit 1
          fi
          bash scripts/coherence/fitcheck-ci.sh

  release:
    name: Publish GitHub Release
    needs: [build, coherence, fitcheck]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum ctx-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ctx-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
