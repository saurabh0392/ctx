name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version and changelog coherence
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md
      - name: Claim consistency
        run: |
          node scripts/coherence/claims.mjs
          node --test scripts/coherence/beta-summary.test.mjs
      - name: Rust quality gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Beta service gates
        run: |
          for service in ctx-dist report-intake; do
            npm ci --prefix "services/$service" --no-audit --no-fund
            npm run --prefix "services/$service" typecheck
            npm run --prefix "services/$service" synth
          done

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (arm64) — also cross-compiles x86_64
            target: aarch64-apple-darwin
          - os: macos-latest       # cross-compile Intel x86_64 from Apple Silicon runner
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        # Serial: the suite mutates process-global env (CTX_HOME/HOME) per test; parallel runs race.
        run: cargo test --all-targets --locked -- --test-threads=1

      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then BINNAME="ctx.exe"; else BINNAME="ctx"; fi
          BIN="target/${{ matrix.target }}/release/$BINNAME"
          ARCHIVE="ctx-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctx-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Behavioral coherence gate: the dashboard must pass every invariant against a seeded fixture before
  # a release can publish. This is the deterministic gate (exact pass/fail).
  coherence:
    name: Behavioral coherence
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build binary + fixture seeder
        run: |
          cargo build --release --locked
          cargo build --release --locked --example seed_coherence_fixture
      - name: Install coherence deps + chromium
        working-directory: scripts/coherence
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Seed the CI fixture
        run: |
          mkdir -p "$RUNNER_TEMP/ctx-fixture"
          CTX_HOME="$RUNNER_TEMP/ctx-fixture" ./target/release/examples/seed_coherence_fixture
      - name: Run coherence suite
        env:
          CTX_FIXTURE: ${{ runner.temp }}/ctx-fixture
          PW_CHANNEL: ""
        run: bash scripts/coherence/coherence.sh

  # Fitcheck gate: a headless persona review of the dashboard. Model judgement, so it blocks the clear
  # failure (Rework) by default; set FITCHECK_MIN_VERDICT=Ship to require a Ship. Needs the API key
  # secret, and fails loudly if absent so a release never publishes with the gate silently skipped.
  fitcheck:
    name: Fitcheck (design gate)
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Fitcheck gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "release fitcheck gate needs the ANTHROPIC_API_KEY secret."
            echo "Set it in repo settings, or bypass one release with SKIP_FITCHECK=1 in this job env."
            exit 1
          fi
          bash scripts/coherence/fitcheck-ci.sh

  release:
    name: Publish GitHub Release
    needs: [build, coherence, fitcheck]
    runs-on: ubuntu-latest
    env:
      # Set these three repo secrets to auto-publish to the token-gated ctx-dist bucket. When BUCKET is
      # empty the S3 step is skipped and only the GitHub Release is produced.
      BUCKET: ${{ secrets.CTX_DIST_BUCKET }}

    steps:
      - uses: actions/checkout@v4 # for scripts/install.sh
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum ctx-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish to ctx-dist (S3, token-gated)
        if: ${{ env.BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CTX_DIST_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CTX_DIST_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          M="$(mktemp)"; printf '{"version":"%s","targets":{}}' "$VERSION" > "$M"
          for f in dist/ctx-*.tar.gz; do
            t="$(basename "$f" .tar.gz)"; t="${t#ctx-}"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            key="bin/ctx-${VERSION}-${t}.tar.gz"
            aws s3 cp "$f" "s3://$BUCKET/$key"
            python3 - "$M" "$t" "$key" "$sha" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1])); m["targets"][sys.argv[2]]={"version":m["version"],"file":sys.argv[3],"sha256":sys.argv[4]}
          json.dump(m,open(sys.argv[1],"w"),indent=2)
          PY
          done
          aws s3 cp "$M" "s3://$BUCKET/manifest/latest.json" --content-type application/json
          aws s3 cp scripts/install.sh "s3://$BUCKET/install.sh" --content-type text/x-shellscript
          aws s3 cp scripts/install.ps1 "s3://$BUCKET/install.ps1" --content-type text/plain
          echo "published $VERSION to ctx-dist"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ctx-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
