name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets a branch run the full pipeline on demand, before opening a PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        # Single-threaded: the suite mutates process-global env (CTX_HOME/HOME) to isolate the ctx
        # db per test. Parallel runs let those mutations race (std::env::set_var is unsafe under
        # threads), which surfaced as a platform-dependent flake. Serial execution is deterministic.
        run: cargo test --all-targets --locked -- --test-threads=1
      - name: Build release
        run: cargo build --release --locked

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    # Hard gate: the msvc build and the full serial suite must pass. The suite is green on Windows
    # as of the first-class port (feat/windows).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --verbose --locked
      - name: Unit tests
        # Serial for the same reason as the Linux job: the suite mutates process-global env.
        run: cargo test --all-targets --locked -- --test-threads=1

  services:
    name: Beta service typecheck + synth
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service: [ctx-dist, report-intake]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install locked dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: services/${{ matrix.service }}
        run: npm run typecheck
      - name: Synthesize infrastructure
        working-directory: services/${{ matrix.service }}
        run: npm run synth

  coherence:
    name: Behavioral coherence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build binary + fixture seeder
        run: |
          cargo build --release --locked
          cargo build --release --locked --example seed_coherence_fixture
      - name: Claim consistency
        run: |
          node scripts/coherence/claims.mjs
          npm --prefix scripts/coherence test
      - name: Install coherence deps + chromium
        working-directory: scripts/coherence
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Seed the CI fixture (no ~/.ctx in CI)
        run: |
          mkdir -p "$RUNNER_TEMP/ctx-fixture"
          CTX_HOME="$RUNNER_TEMP/ctx-fixture" ./target/release/examples/seed_coherence_fixture
      - name: Run coherence suite
        env:
          CTX_FIXTURE: ${{ runner.temp }}/ctx-fixture
          PW_CHANNEL: ""            # empty: use the chromium playwright installed, not branded Chrome
        run: bash scripts/coherence/coherence.sh

  fitcheck:
    name: Fitcheck (design gate)
    runs-on: ubuntu-22.04
    # Hard gate: a required status check. A PR with no ANTHROPIC_API_KEY (fork) still passes because
    # the step below exits 0 when the key is absent; only a real fitcheck failure blocks the merge.
    # See scripts/coherence/fitcheck-ci.sh.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Fitcheck
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No ANTHROPIC_API_KEY available (fork PR or unset). Skipping fitcheck."
            exit 0
          fi
          bash scripts/coherence/fitcheck-ci.sh
